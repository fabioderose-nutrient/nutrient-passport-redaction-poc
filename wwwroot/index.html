<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passport Redaction</title>
  <link rel="stylesheet" href="/css/styles.css?v=qr3" />
  <!-- Nutrient Web SDK from the CDN (same version as baseUrl in js/app.js). -->
  <script src="https://cdn.cloud.pspdfkit.com/pspdfkit-web@1.13.1/nutrient-viewer.js"></script>
</head>
<body>
  <div id="content">
  <!-- Left sidebar: document list -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <span>Documents</span>
    </div>
    <ul id="document-list"></ul>
  </aside>

  <!-- Main viewer area -->
  <main id="main">
    <div id="viewer-container"></div>

    <!-- Empty state shown when no document is loaded -->
    <div id="empty-state">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <p>Select a document from the sidebar to begin</p>
    </div>
  </main>

  <!-- Right panel: parsed QR data -->
  <aside id="qr-panel" class="qr-panel" style="display:none">
    <div class="qr-panel-header">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <line x1="14" y1="14" x2="14" y2="21"/>
        <line x1="18" y1="14" x2="21" y2="14"/>
        <line x1="18" y1="18" x2="21" y2="21"/>
      </svg>
      <span id="qr-panel-title">QR Data</span>
      <button id="qr-panel-close" class="qr-panel-close" title="Close">&times;</button>
    </div>
    <div id="qr-panel-body" class="qr-panel-body"></div>
  </aside>

  </div><!-- /content -->

  <!-- Redaction modal -->
  <div id="redaction-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="18" rx="2"/>
          <line x1="2" y1="15" x2="22" y2="15"/>
          <line x1="2" y1="18" x2="22" y2="18"/>
        </svg>
        <h2>Document Redaction</h2>
      </div>
      <p class="modal-description">Select the information you want to redact:</p>

      <!-- Tab bar (one tab per document category) — populated by app.js -->
      <div id="modal-tabs" class="modal-tabs"></div>

      <!-- Field grids, one panel per category — populated by app.js -->
      <div id="modal-tab-panels"></div>

      <div class="modal-actions">
        <button id="btn-cancel" class="btn btn-secondary">Cancel</button>
        <button id="btn-select-all" class="btn btn-secondary">Select All</button>
        <button id="btn-redact" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
          Redact
        </button>
      </div>
    </div>
  </div>

  <!-- Error/info popup -->
  <div id="toast" class="toast" style="display:none"></div>

  <!-- Loading overlay -->
  <div id="loading-overlay" style="display:none">
    <div class="spinner"></div>
    <p id="loading-text">Processing passport...</p>
  </div>

  <script src="/js/app.js?v=qr3"></script>
</body>
</html>
